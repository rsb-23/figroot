[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "figroot"
description = "A unified interface for reading configuration files."
dynamic = ["version"]
requires-python = ">=3.11"

readme = "README.md"
authors = [{ name = "Rishabh B", email = "null@example.com" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Utilities"
]

[project.optional-dependencies]
yaml = ["pyyaml"]
lint = ["pre-commit"]
test = ["pytest", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/rsb-23/figroot"
Repository = "https://github.com/rsb-23/figroot"
Issues = "https://github.com/rsb-23/figroot/issues"
Releases = "https://github.com/rsb-23/figroot/releases"

# Build Config
[tool.hatch.version]
source = "vcs"
[tool.hatch.build.targets.sdist]
include = ["figroot/", "LICENSE", "README.md", "pyproject.toml"]
[tool.hatch.build.targets.wheel]
packages = ["figroot"]

# Tool Config
[tool.black]
target-version = ["py311", "py312", "py313", "py314"]
line-length = 120
skip-magic-trailing-comma = true

[tool.flake8]
max-line-length = 120
ignore = ["E203", "E501", "W503"]
exclude = [".git", "__pycache__", ".venv"]
per-file-ignores = ["*/__init__.py: F401"]

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
split_on_trailing_comma = false

[tool.pylint]
jobs = 2
ignore-paths = ["^(?!^(src|tests?|.+.py)$).+$"]
max-line-length = 130

[tool.pylint.messages_control]
disable = [
    "I",
    "import-error",
    "fixme",
    "missing-docstring",
    "duplicate-code",
    "no-name-in-module",
    "too-few-public-methods"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 75.0
[tool.coverage.run]
source = ["figroot/"]
omit = ["tests/*", "usage.py"]
